name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - features
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Qualidade, testes e segurança
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar o projeto
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Verificar formatação
        run: python -m ruff format --check src tests notebooks

      - name: Executar lint
        run: python -m ruff check src tests notebooks

      - name: Verificar tipos
        run: python -m mypy src

      - name: Analisar código Python
        run: python -m bandit -q -r src -lll

      - name: Auditar dependências de produção
        run: python -m pip_audit .

      - name: Executar testes e contratos de dados
        run: python -m pytest --cov=pokeapi_lakehouse --cov-report=term-missing --cov-report=xml --cov-fail-under=40

      - name: Construir wheel
        run: python -m pip wheel . --no-deps --no-build-isolation --no-cache-dir --wheel-dir .artifacts

      - name: Publicar relatórios para diagnóstico
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-reports-${{ github.run_id }}
          path: |
            coverage.xml
            .artifacts/*.whl
          if-no-files-found: warn
          retention-days: 7
