name: CD Databricks

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: databricks-development
  cancel-in-progress: false

jobs:
  deploy:
    name: Validar e implantar bundle
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: development
    env:
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

    steps:
      - name: Checkout da revisão aprovada pelo CI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Configurar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar ferramentas de build
        run: python -m pip install --disable-pip-version-check "setuptools>=70" "wheel>=0.44,<1"

      - name: Construir wheel
        run: python -m pip wheel . --no-deps --no-build-isolation --no-cache-dir --wheel-dir .artifacts

      - name: Configurar Databricks CLI
        uses: databricks/setup-cli@8821c27b1fe57472264eeb6e50c1f31d69552f28 # v1.10.0

      - name: Validar autenticação
        run: databricks current-user me

      - name: Validar bundle
        run: databricks bundle validate -t dev

      - name: Implantar no ambiente development
        run: databricks bundle deploy -t dev
