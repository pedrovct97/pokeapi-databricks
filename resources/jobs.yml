resources:
  jobs:
    bronze_ingestion:
      name: pokeapi-bronze-ingestion-${bundle.target}
      description: Ingestão idempotente de todos os recursos REST v2 da PokéAPI na camada Bronze.
      max_concurrent_runs: 1
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.bronze_schema}
        - name: endpoints
          default: all
      tasks:
        - task_key: ingest_all_endpoints
          environment_key: default
          timeout_seconds: 7200
          max_retries: 1
          min_retry_interval_millis: 60000
          python_wheel_task:
            package_name: pokeapi_lakehouse
            entry_point: bronze_ingestion
            parameters:
              - --catalog
              - "{{job.parameters.catalog}}"
              - --schema
              - "{{job.parameters.schema}}"
              - --endpoints
              - "{{job.parameters.endpoints}}"
      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies:
              - ${var.package_wheel_path}

    silver_transformation:
      name: pokeapi-silver-transformation-${bundle.target}
      description: Transformação SQL-first Silver do domínio de Pokémon e batalhas.
      max_concurrent_runs: 1
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: bronze_schema
          default: ${var.bronze_schema}
        - name: silver_schema
          default: ${var.silver_schema}
        - name: entities
          default: all
      tasks:
        - task_key: transform_pokemon_and_move
          environment_key: default
          timeout_seconds: 3600
          max_retries: 1
          min_retry_interval_millis: 60000
          python_wheel_task:
            package_name: pokeapi_lakehouse
            entry_point: silver_transform
            parameters:
              - --catalog
              - "{{job.parameters.catalog}}"
              - --bronze-schema
              - "{{job.parameters.bronze_schema}}"
              - --silver-schema
              - "{{job.parameters.silver_schema}}"
              - --entities
              - "{{job.parameters.entities}}"
      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies:
              - ${var.package_wheel_path}

    metadata_sync:
      name: pokeapi-metadata-sync-${bundle.target}
      description: Sincroniza comentários de tabelas e colunas no Unity Catalog a partir dos contratos YAML.
      max_concurrent_runs: 1
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: bronze_schema
          default: ${var.bronze_schema}
        - name: silver_schema
          default: ${var.silver_schema}
        - name: gold_schema
          default: ${var.gold_schema}
        - name: layers
          default: all
        - name: domains
          default: all
      tasks:
        - task_key: sync_uc_comments
          environment_key: default
          timeout_seconds: 1800
          max_retries: 0
          python_wheel_task:
            package_name: pokeapi_lakehouse
            entry_point: metadata_sync
            parameters:
              - --catalog
              - "{{job.parameters.catalog}}"
              - --bronze-schema
              - "{{job.parameters.bronze_schema}}"
              - --silver-schema
              - "{{job.parameters.silver_schema}}"
              - --gold-schema
              - "{{job.parameters.gold_schema}}"
              - --layers
              - "{{job.parameters.layers}}"
              - --domains
              - "{{job.parameters.domains}}"
      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies:
              - ${var.package_wheel_path}

    gold_transformation:
      name: pokeapi-gold-transformation-${bundle.target}
      description: Publica contexto/catálogo/fundação Gold e calcula matchup em workers por partição.
      max_concurrent_runs: 1
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: bronze_schema
          default: ${var.bronze_schema}
        - name: silver_schema
          default: ${var.silver_schema}
        - name: gold_schema
          default: ${var.gold_schema}
        - name: matchup_partitions
          default: '["red-blue","yellow","gold-silver","crystal","ruby-sapphire","emerald","firered-leafgreen","diamond-pearl|50","diamond-pearl|80","diamond-pearl|100","platinum","heartgold-soulsilver|50","heartgold-soulsilver|80","heartgold-soulsilver|100","black-white|50","black-white|80","black-white|100","colosseum","xd","black-2-white-2|50","black-2-white-2|80","black-2-white-2|100","x-y|50","x-y|80","x-y|100","omega-ruby-alpha-sapphire|50","omega-ruby-alpha-sapphire|80","omega-ruby-alpha-sapphire|100","sun-moon|50","sun-moon|80","sun-moon|100","ultra-sun-ultra-moon|50","ultra-sun-ultra-moon|80","ultra-sun-ultra-moon|100","lets-go-pikachu-lets-go-eevee","sword-shield|50","sword-shield|80","sword-shield|100","brilliant-diamond-shining-pearl","legends-arceus","scarlet-violet|50","scarlet-violet|80","scarlet-violet|100","red-green-japan","blue-japan","champions"]'
      tasks:
        - task_key: publish_gold_products
          environment_key: default
          timeout_seconds: 3600
          max_retries: 1
          min_retry_interval_millis: 60000
          python_wheel_task:
            package_name: pokeapi_lakehouse
            entry_point: gold_transform
            parameters:
              - --catalog
              - "{{job.parameters.catalog}}"
              - --bronze-schema
              - "{{job.parameters.bronze_schema}}"
              - --silver-schema
              - "{{job.parameters.silver_schema}}"
              - --gold-schema
              - "{{job.parameters.gold_schema}}"
        - task_key: publish_matchup_partitions
          depends_on:
            - task_key: publish_gold_products
          for_each_task:
            inputs: "{{job.parameters.matchup_partitions}}"
            concurrency: 6
            task:
              task_key: publish_matchup_partition
              environment_key: default
              timeout_seconds: 10800
              max_retries: 1
              min_retry_interval_millis: 60000
              python_wheel_task:
              
                package_name: pokeapi_lakehouse
                entry_point: matchup_transform
                parameters:
                  - --catalog
                  - "{{job.parameters.catalog}}"
                  - --silver-schema
                  - "{{job.parameters.silver_schema}}"
                  - --gold-schema
                  - "{{job.parameters.gold_schema}}"
                  - --partition
                  - "{{input}}"
        - task_key: publish_matchup_serving_marts
          depends_on:
            - task_key: publish_matchup_partitions
          environment_key: default
          timeout_seconds: 3600
          max_retries: 1
          min_retry_interval_millis: 60000
          python_wheel_task:
            package_name: pokeapi_lakehouse
            entry_point: matchup_serving_marts
            parameters:
              - --catalog
              - "{{job.parameters.catalog}}"
              - --gold-schema
              - "{{job.parameters.gold_schema}}"
      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies:
              - ${var.package_wheel_path}
