[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "pokeapi-lakehouse"
version = "0.9.14"
description = "Pipeline Lakehouse da PokéAPI para Databricks Free Edition"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6,<7",
]

[project.scripts]
bronze_ingestion = "pokeapi_lakehouse.cli:main"
silver_transform = "pokeapi_lakehouse.silver_cli:main"
gold_transform = "pokeapi_lakehouse.gold_cli:main"
matchup_transform = "pokeapi_lakehouse.matchup_cli:main"
metadata_sync = "pokeapi_lakehouse.metadata_cli:main"

[project.optional-dependencies]
dev = [
  "bandit>=1.8,<2",
  "great-expectations>=1.19,<2",
  "mypy>=1.10,<3",
  "pandas>=2.2,<4",
  "pip-audit>=2.9,<3",
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.5,<1",
  "wheel>=0.44,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pokeapi_lakehouse = ["contracts/**/*.yaml", "sql/**/*.sql"]

[tool.pytest.ini_options]
addopts = "-ra -p no:cacheprovider"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
  ".artifacts",
  ".databricks-ai-tools",
  ".hermes",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["pokeapi_lakehouse"]

[[tool.mypy.overrides]]
module = ["pyspark", "pyspark.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true
