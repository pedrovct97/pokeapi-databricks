version: 1
layer: silver
domain: table
owner: pokeapi_lakehouse
logical_name: pokemon
table: pokemon
description: Cadastro atual tipado de Pokémon derivado exclusivamente da Bronze
grain: uma linha por tabela normalizada Silver em pokemon
primary_key:
- pokemon_id
foreign_keys:
- columns:
  - species_id
  references: silver.pokemon_species.species_id
partition_by: []
columns:
- name: pokemon_id
  type: BIGINT
  nullable: false
  description: Identificador da PokéAPI; chave lógica
  semantic_role: business_key
- name: pokemon_name
  type: STRING
  nullable: false
  description: Nome canônico do Pokémon
  semantic_role: dimension
- name: base_experience
  type: BIGINT
  nullable: true
  description: Experiência base concedida ao derrotar o Pokémon
  semantic_role: metric
- name: height_dm
  type: BIGINT
  nullable: false
  description: Altura original em decímetros
  semantic_role: metric
- name: height_m
  type: DECIMAL(10,2)
  nullable: false
  description: Altura derivada em metros
  semantic_role: metric
- name: weight_hg
  type: BIGINT
  nullable: false
  description: Peso original em hectogramas
  semantic_role: metric
- name: weight_kg
  type: DECIMAL(10,2)
  nullable: false
  description: Peso derivado em quilogramas
  semantic_role: metric
- name: is_default
  type: BOOLEAN
  nullable: false
  description: Indica a variedade padrão da espécie
  semantic_role: quality
- name: sort_order
  type: BIGINT
  nullable: true
  description: Ordem definida pela origem
  semantic_role: metric
- name: species_id
  type: BIGINT
  nullable: true
  description: Identificador da espécie relacionada
  semantic_role: business_key
- name: species_name
  type: STRING
  nullable: true
  description: Nome da espécie relacionada
  semantic_role: dimension
- name: source_url
  type: STRING
  nullable: false
  description: URL do registro Bronze utilizado
  semantic_role: lineage
- name: source_payload_sha256
  type: STRING
  nullable: false
  description: Versão do payload Bronze
  semantic_role: lineage
- name: source_observed_at
  type: TIMESTAMP
  nullable: false
  description: Momento horário de Brasília (UTC-3) da observação na fonte
  semantic_role: lineage
- name: silver_transformed_at
  type: TIMESTAMP
  nullable: false
  description: Momento horário de Brasília (UTC-3) da transformação
  semantic_role: audit
- name: silver_run_id
  type: STRING
  nullable: false
  description: UUID da execução Silver
  semantic_role: audit
quality_expectations:
- name: schema_columns_match_ddl
  type: expect_table_columns_to_match_ordered_list
  columns:
  - pokemon_id
  - pokemon_name
  - base_experience
  - height_dm
  - height_m
  - weight_hg
  - weight_kg
  - is_default
  - sort_order
  - species_id
  - species_name
  - source_url
  - source_payload_sha256
  - source_observed_at
  - silver_transformed_at
  - silver_run_id
  severity: error
- name: primary_key_not_null
  type: expect_column_values_to_not_be_null
  columns:
  - pokemon_id
  severity: error
- name: primary_key_unique
  type: expect_compound_columns_to_be_unique
  columns:
  - pokemon_id
  severity: error
- name: pokemon_name_not_null
  type: expect_column_values_to_not_be_null
  column: pokemon_name
  severity: error
- name: height_dm_not_null
  type: expect_column_values_to_not_be_null
  column: height_dm
  severity: error
- name: height_m_not_null
  type: expect_column_values_to_not_be_null
  column: height_m
  severity: error
- name: weight_hg_not_null
  type: expect_column_values_to_not_be_null
  column: weight_hg
  severity: error
- name: weight_kg_not_null
  type: expect_column_values_to_not_be_null
  column: weight_kg
  severity: error
- name: is_default_not_null
  type: expect_column_values_to_not_be_null
  column: is_default
  severity: error
- name: source_url_not_null
  type: expect_column_values_to_not_be_null
  column: source_url
  severity: error
- name: source_payload_sha256_not_null
  type: expect_column_values_to_not_be_null
  column: source_payload_sha256
  severity: error
- name: source_observed_at_not_null
  type: expect_column_values_to_not_be_null
  column: source_observed_at
  severity: error
- name: silver_transformed_at_not_null
  type: expect_column_values_to_not_be_null
  column: silver_transformed_at
  severity: error
- name: silver_run_id_not_null
  type: expect_column_values_to_not_be_null
  column: silver_run_id
  severity: error
sql_templates:
- sql/silver/create/create_silver_pokemon.sql
- sql/silver/stage/stage_silver_pokemon.sql
- sql/silver/merge/merge_silver_pokemon.sql
- sql/silver/quality/quality_silver_pokemon.sql
