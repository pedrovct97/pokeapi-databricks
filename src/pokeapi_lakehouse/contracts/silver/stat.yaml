version: 1
layer: silver
domain: table
owner: pokeapi_lakehouse
logical_name: stat
table: stat
description: Estatísticas tipadas da PokéAPI
grain: uma linha por tabela normalizada Silver em stat
primary_key:
- stat_id
foreign_keys: []
partition_by: []
columns:
- name: stat_id
  type: BIGINT
  nullable: false
  description: Identificador de stat
  semantic_role: business_key
- name: stat_name
  type: STRING
  nullable: false
  description: Nome técnico de stat
  semantic_role: dimension
- name: game_index
  type: INT
  nullable: true
  description: Campo game index documentado a partir do contrato da tabela
  semantic_role: metric
- name: is_battle_only
  type: BOOLEAN
  nullable: false
  description: Campo is battle only documentado a partir do contrato da tabela
  semantic_role: quality
- name: damage_class_id
  type: BIGINT
  nullable: true
  description: Identificador de damage class
  semantic_role: business_key
- name: damage_class_name
  type: STRING
  nullable: true
  description: Nome técnico de damage class
  semantic_role: dimension
- name: source_url
  type: STRING
  nullable: false
  description: URL canônica do recurso Bronze usado como linhagem da transformação
  semantic_role: lineage
- name: source_payload_sha256
  type: STRING
  nullable: false
  description: Hash SHA-256 do payload Bronze usado como versão e linhagem
  semantic_role: lineage
- name: source_observed_at
  type: TIMESTAMP
  nullable: false
  description: Timestamp horário de Brasília (UTC-3) da observação do dado na origem
  semantic_role: lineage
- name: silver_transformed_at
  type: TIMESTAMP
  nullable: false
  description: Timestamp horário de Brasília (UTC-3) da transformação Silver
  semantic_role: audit
- name: silver_run_id
  type: STRING
  nullable: false
  description: UUID da execução Silver responsável pela publicação
  semantic_role: audit
quality_expectations:
- name: schema_columns_match_ddl
  type: expect_table_columns_to_match_ordered_list
  columns:
  - stat_id
  - stat_name
  - game_index
  - is_battle_only
  - damage_class_id
  - damage_class_name
  - source_url
  - source_payload_sha256
  - source_observed_at
  - silver_transformed_at
  - silver_run_id
  severity: error
- name: primary_key_not_null
  type: expect_column_values_to_not_be_null
  columns:
  - stat_id
  severity: error
- name: primary_key_unique
  type: expect_compound_columns_to_be_unique
  columns:
  - stat_id
  severity: error
- name: stat_name_not_null
  type: expect_column_values_to_not_be_null
  column: stat_name
  severity: error
- name: is_battle_only_not_null
  type: expect_column_values_to_not_be_null
  column: is_battle_only
  severity: error
- name: source_url_not_null
  type: expect_column_values_to_not_be_null
  column: source_url
  severity: error
- name: source_payload_sha256_not_null
  type: expect_column_values_to_not_be_null
  column: source_payload_sha256
  severity: error
- name: source_observed_at_not_null
  type: expect_column_values_to_not_be_null
  column: source_observed_at
  severity: error
- name: silver_transformed_at_not_null
  type: expect_column_values_to_not_be_null
  column: silver_transformed_at
  severity: error
- name: silver_run_id_not_null
  type: expect_column_values_to_not_be_null
  column: silver_run_id
  severity: error
sql_templates:
- sql/silver/create/create_silver_stat.sql
- sql/silver/stage/stage_silver_stat.sql
- sql/silver/merge/merge_silver_stat.sql
- sql/silver/quality/quality_silver_stat.sql
