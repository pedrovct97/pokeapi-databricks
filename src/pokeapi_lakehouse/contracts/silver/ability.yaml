version: 1
layer: silver
domain: table
owner: pokeapi_lakehouse
logical_name: ability
table: ability
description: Habilidades tipadas da PokéAPI
grain: uma linha por tabela normalizada Silver em ability
primary_key:
- ability_id
foreign_keys: []
partition_by: []
columns:
- name: ability_id
  type: BIGINT
  nullable: false
  description: Identificador de ability
  semantic_role: business_key
- name: ability_name
  type: STRING
  nullable: false
  description: Nome técnico de ability
  semantic_role: dimension
- name: is_main_series
  type: BOOLEAN
  nullable: false
  description: Campo is main series documentado a partir do contrato da tabela
  semantic_role: quality
- name: generation_id
  type: BIGINT
  nullable: true
  description: Identificador de generation
  semantic_role: business_key
- name: generation_name
  type: STRING
  nullable: true
  description: Nome técnico de generation
  semantic_role: dimension
- name: source_url
  type: STRING
  nullable: false
  description: URL canônica do recurso Bronze usado como linhagem da transformação
  semantic_role: lineage
- name: source_payload_sha256
  type: STRING
  nullable: false
  description: Hash SHA-256 do payload Bronze usado como versão e linhagem
  semantic_role: lineage
- name: source_observed_at
  type: TIMESTAMP
  nullable: false
  description: Timestamp horário de Brasília (UTC-3) da observação do dado na origem
  semantic_role: lineage
- name: silver_transformed_at
  type: TIMESTAMP
  nullable: false
  description: Timestamp horário de Brasília (UTC-3) da transformação Silver
  semantic_role: audit
- name: silver_run_id
  type: STRING
  nullable: false
  description: UUID da execução Silver responsável pela publicação
  semantic_role: audit
quality_expectations:
- name: schema_columns_match_ddl
  type: expect_table_columns_to_match_ordered_list
  columns:
  - ability_id
  - ability_name
  - is_main_series
  - generation_id
  - generation_name
  - source_url
  - source_payload_sha256
  - source_observed_at
  - silver_transformed_at
  - silver_run_id
  severity: error
- name: primary_key_not_null
  type: expect_column_values_to_not_be_null
  columns:
  - ability_id
  severity: error
- name: primary_key_unique
  type: expect_compound_columns_to_be_unique
  columns:
  - ability_id
  severity: error
- name: ability_name_not_null
  type: expect_column_values_to_not_be_null
  column: ability_name
  severity: error
- name: is_main_series_not_null
  type: expect_column_values_to_not_be_null
  column: is_main_series
  severity: error
- name: source_url_not_null
  type: expect_column_values_to_not_be_null
  column: source_url
  severity: error
- name: source_payload_sha256_not_null
  type: expect_column_values_to_not_be_null
  column: source_payload_sha256
  severity: error
- name: source_observed_at_not_null
  type: expect_column_values_to_not_be_null
  column: source_observed_at
  severity: error
- name: silver_transformed_at_not_null
  type: expect_column_values_to_not_be_null
  column: silver_transformed_at
  severity: error
- name: silver_run_id_not_null
  type: expect_column_values_to_not_be_null
  column: silver_run_id
  severity: error
sql_templates:
- sql/silver/create/create_silver_ability.sql
- sql/silver/stage/stage_silver_ability.sql
- sql/silver/merge/merge_silver_ability.sql
- sql/silver/quality/quality_silver_ability.sql
