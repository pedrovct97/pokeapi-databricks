version: 1
layer: silver
domain: table
owner: pokeapi_lakehouse
logical_name: type_damage_relation
table: type_damage_relation
description: Exceções à efetividade neutra entre tipos; ausência equivale a multiplicador 1.0
grain: uma linha por tabela normalizada Silver em type_damage_relation
primary_key:
- source_type_id
- target_type_id
foreign_keys:
- columns:
  - source_type_id
  references: silver.type.type_id
- columns:
  - target_type_id
  references: silver.type.type_id
partition_by: []
columns:
- name: source_type_id
  type: BIGINT
  nullable: false
  description: Identificador de source type
  semantic_role: business_key
- name: source_type_name
  type: STRING
  nullable: false
  description: Nome técnico de source type
  semantic_role: dimension
- name: target_type_id
  type: BIGINT
  nullable: false
  description: Identificador de target type
  semantic_role: business_key
- name: target_type_name
  type: STRING
  nullable: false
  description: Nome técnico de target type
  semantic_role: dimension
- name: damage_multiplier
  type: DECIMAL(3,1)
  nullable: false
  description: Campo damage multiplier documentado a partir do contrato da tabela
  semantic_role: metric
- name: source_url
  type: STRING
  nullable: false
  description: URL canônica do recurso Bronze usado como linhagem da transformação
  semantic_role: lineage
- name: source_payload_sha256
  type: STRING
  nullable: false
  description: Hash SHA-256 do payload Bronze usado como versão e linhagem
  semantic_role: lineage
- name: source_observed_at
  type: TIMESTAMP
  nullable: false
  description: Timestamp horário de Brasília (UTC-3) da observação do dado na origem
  semantic_role: lineage
- name: silver_transformed_at
  type: TIMESTAMP
  nullable: false
  description: Timestamp horário de Brasília (UTC-3) da transformação Silver
  semantic_role: audit
- name: silver_run_id
  type: STRING
  nullable: false
  description: UUID da execução Silver responsável pela publicação
  semantic_role: audit
