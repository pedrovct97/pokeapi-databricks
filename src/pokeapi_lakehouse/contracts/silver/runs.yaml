version: 1
layer: silver
domain: table
owner: pokeapi_lakehouse
logical_name: runs
table: _silver_runs
description: Reconciliação das transformações da camada Silver
grain: uma linha por entidade processada em uma execução Silver
primary_key:
- silver_run_id
- entity
foreign_keys: []
partition_by: []
columns:
- name: silver_run_id
  type: STRING
  nullable: false
  description: UUID da execução Silver
  semantic_role: audit
- name: entity
  type: STRING
  nullable: false
  description: Entidade processada
  semantic_role: dimension
- name: started_at
  type: TIMESTAMP
  nullable: false
  description: Início horário de Brasília (UTC-3) da transformação
  semantic_role: audit
- name: finished_at
  type: TIMESTAMP
  nullable: false
  description: Fim horário de Brasília (UTC-3) ou último checkpoint
  semantic_role: audit
- name: status
  type: STRING
  nullable: false
  description: RUNNING, SUCCESS ou FAILED
  semantic_role: audit
- name: source_count
  type: BIGINT
  nullable: false
  description: Versões atuais encontradas na Bronze
  semantic_role: metric
- name: valid_count
  type: BIGINT
  nullable: false
  description: Registros aprovados para publicação
  semantic_role: metric
- name: quarantined_count
  type: BIGINT
  nullable: false
  description: Registros rejeitados
  semantic_role: metric
- name: inserted_count
  type: BIGINT
  nullable: false
  description: Novas chaves inseridas na Silver
  semantic_role: metric
- name: published_count
  type: BIGINT
  nullable: false
  description: Total atual da entidade na Silver
  semantic_role: metric
- name: duration_ms
  type: BIGINT
  nullable: false
  description: Duração da entidade em milissegundos
  semantic_role: audit
- name: transformer_version
  type: STRING
  nullable: false
  description: Versão do transformador Silver
  semantic_role: dimension
- name: error_message
  type: STRING
  nullable: true
  description: Resumo técnico da falha
  semantic_role: audit
quality_expectations:
- name: schema_columns_match_ddl
  type: expect_table_columns_to_match_ordered_list
  columns:
  - silver_run_id
  - entity
  - started_at
  - finished_at
  - status
  - source_count
  - valid_count
  - quarantined_count
  - inserted_count
  - published_count
  - duration_ms
  - transformer_version
  - error_message
  severity: error
- name: primary_key_not_null
  type: expect_column_values_to_not_be_null
  columns:
  - silver_run_id
  - entity
  severity: error
- name: primary_key_unique
  type: expect_compound_columns_to_be_unique
  columns:
  - silver_run_id
  - entity
  severity: error
- name: started_at_not_null
  type: expect_column_values_to_not_be_null
  column: started_at
  severity: error
- name: finished_at_not_null
  type: expect_column_values_to_not_be_null
  column: finished_at
  severity: error
- name: status_not_null
  type: expect_column_values_to_not_be_null
  column: status
  severity: error
- name: source_count_not_null
  type: expect_column_values_to_not_be_null
  column: source_count
  severity: error
- name: valid_count_not_null
  type: expect_column_values_to_not_be_null
  column: valid_count
  severity: error
- name: quarantined_count_not_null
  type: expect_column_values_to_not_be_null
  column: quarantined_count
  severity: error
- name: inserted_count_not_null
  type: expect_column_values_to_not_be_null
  column: inserted_count
  severity: error
- name: published_count_not_null
  type: expect_column_values_to_not_be_null
  column: published_count
  severity: error
- name: duration_ms_not_null
  type: expect_column_values_to_not_be_null
  column: duration_ms
  severity: error
- name: transformer_version_not_null
  type: expect_column_values_to_not_be_null
  column: transformer_version
  severity: error
sql_templates:
- sql/silver/create/create_silver_runs.sql
- sql/silver/merge/merge_silver_runs.sql
