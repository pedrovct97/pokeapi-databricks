version: 1
layer: silver
domain: table
owner: pokeapi_lakehouse
logical_name: pokemon_type
table: pokemon_type
description: Relação entre Pokémon e tipos elementais
grain: uma linha por tabela normalizada Silver em pokemon_type
primary_key:
- pokemon_id
- type_slot
foreign_keys:
- columns:
  - pokemon_id
  references: silver.pokemon.pokemon_id
- columns:
  - type_id
  references: silver.type.type_id
partition_by: []
columns:
- name: pokemon_id
  type: BIGINT
  nullable: false
  description: Identificador de pokemon
  semantic_role: business_key
- name: slot
  type: INT
  nullable: false
  description: Campo slot documentado a partir do contrato da tabela
  semantic_role: metric
- name: type_id
  type: BIGINT
  nullable: false
  description: Identificador de type
  semantic_role: business_key
- name: type_name
  type: STRING
  nullable: false
  description: Nome técnico de type
  semantic_role: dimension
- name: source_url
  type: STRING
  nullable: false
  description: URL canônica do recurso Bronze usado como linhagem da transformação
  semantic_role: lineage
- name: source_payload_sha256
  type: STRING
  nullable: false
  description: Hash SHA-256 do payload Bronze usado como versão e linhagem
  semantic_role: lineage
- name: source_observed_at
  type: TIMESTAMP
  nullable: false
  description: Timestamp horário de Brasília (UTC-3) da observação do dado na origem
  semantic_role: lineage
- name: silver_transformed_at
  type: TIMESTAMP
  nullable: false
  description: Timestamp horário de Brasília (UTC-3) da transformação Silver
  semantic_role: audit
- name: silver_run_id
  type: STRING
  nullable: false
  description: UUID da execução Silver responsável pela publicação
  semantic_role: audit
quality_expectations:
- name: schema_columns_match_ddl
  type: expect_table_columns_to_match_ordered_list
  columns:
  - pokemon_id
  - slot
  - type_id
  - type_name
  - source_url
  - source_payload_sha256
  - source_observed_at
  - silver_transformed_at
  - silver_run_id
  severity: error
- name: primary_key_not_null
  type: expect_column_values_to_not_be_null
  columns:
  - pokemon_id
  - type_slot
  severity: error
- name: primary_key_unique
  type: expect_compound_columns_to_be_unique
  columns:
  - pokemon_id
  - type_slot
  severity: error
- name: slot_not_null
  type: expect_column_values_to_not_be_null
  column: slot
  severity: error
- name: type_id_not_null
  type: expect_column_values_to_not_be_null
  column: type_id
  severity: error
- name: type_name_not_null
  type: expect_column_values_to_not_be_null
  column: type_name
  severity: error
- name: source_url_not_null
  type: expect_column_values_to_not_be_null
  column: source_url
  severity: error
- name: source_payload_sha256_not_null
  type: expect_column_values_to_not_be_null
  column: source_payload_sha256
  severity: error
- name: source_observed_at_not_null
  type: expect_column_values_to_not_be_null
  column: source_observed_at
  severity: error
- name: silver_transformed_at_not_null
  type: expect_column_values_to_not_be_null
  column: silver_transformed_at
  severity: error
- name: silver_run_id_not_null
  type: expect_column_values_to_not_be_null
  column: silver_run_id
  severity: error
sql_templates:
- sql/silver/create/create_silver_pokemon_type.sql
- sql/silver/stage/stage_silver_pokemon_type.sql
- sql/silver/merge/merge_silver_pokemon_type.sql
- sql/silver/quality/quality_silver_pokemon_type.sql
