version: 1
layer: silver
domain: table
owner: pokeapi_lakehouse
logical_name: pokemon_move
table: pokemon_move
description: Movimentos aprendidos por Pokémon, versão e método
grain: uma linha por tabela normalizada Silver em pokemon_move
primary_key:
- pokemon_id
- move_id
- version_group_name
- learn_method_name
- level_learned_at
foreign_keys:
- columns:
  - pokemon_id
  references: silver.pokemon.pokemon_id
- columns:
  - move_id
  references: silver.move.move_id
partition_by: []
columns:
- name: pokemon_id
  type: BIGINT
  nullable: false
  description: Identificador de pokemon
  semantic_role: business_key
- name: move_id
  type: BIGINT
  nullable: false
  description: Identificador de move
  semantic_role: business_key
- name: move_name
  type: STRING
  nullable: false
  description: Nome técnico de move
  semantic_role: dimension
- name: version_group_id
  type: BIGINT
  nullable: false
  description: Identificador de version group
  semantic_role: business_key
- name: version_group_name
  type: STRING
  nullable: false
  description: Nome técnico de version group
  semantic_role: dimension
- name: learn_method_id
  type: BIGINT
  nullable: false
  description: Identificador de learn method
  semantic_role: business_key
- name: learn_method_name
  type: STRING
  nullable: false
  description: Nome técnico de learn method
  semantic_role: dimension
- name: level_learned_at
  type: INT
  nullable: false
  description: Timestamp associado a level learned
  semantic_role: audit
- name: sort_order
  type: INT
  nullable: true
  description: Campo sort order documentado a partir do contrato da tabela
  semantic_role: metric
- name: source_url
  type: STRING
  nullable: false
  description: URL canônica do recurso Bronze usado como linhagem da transformação
  semantic_role: lineage
- name: source_payload_sha256
  type: STRING
  nullable: false
  description: Hash SHA-256 do payload Bronze usado como versão e linhagem
  semantic_role: lineage
- name: source_observed_at
  type: TIMESTAMP
  nullable: false
  description: Timestamp horário de Brasília (UTC-3) da observação do dado na origem
  semantic_role: lineage
- name: silver_transformed_at
  type: TIMESTAMP
  nullable: false
  description: Timestamp horário de Brasília (UTC-3) da transformação Silver
  semantic_role: audit
- name: silver_run_id
  type: STRING
  nullable: false
  description: UUID da execução Silver responsável pela publicação
  semantic_role: audit
quality_expectations:
- name: schema_columns_match_ddl
  type: expect_table_columns_to_match_ordered_list
  columns:
  - pokemon_id
  - move_id
  - move_name
  - version_group_id
  - version_group_name
  - learn_method_id
  - learn_method_name
  - level_learned_at
  - sort_order
  - source_url
  - source_payload_sha256
  - source_observed_at
  - silver_transformed_at
  - silver_run_id
  severity: error
- name: primary_key_not_null
  type: expect_column_values_to_not_be_null
  columns:
  - pokemon_id
  - move_id
  - version_group_name
  - learn_method_name
  - level_learned_at
  severity: error
- name: primary_key_unique
  type: expect_compound_columns_to_be_unique
  columns:
  - pokemon_id
  - move_id
  - version_group_name
  - learn_method_name
  - level_learned_at
  severity: error
- name: move_name_not_null
  type: expect_column_values_to_not_be_null
  column: move_name
  severity: error
- name: version_group_id_not_null
  type: expect_column_values_to_not_be_null
  column: version_group_id
  severity: error
- name: learn_method_id_not_null
  type: expect_column_values_to_not_be_null
  column: learn_method_id
  severity: error
- name: source_url_not_null
  type: expect_column_values_to_not_be_null
  column: source_url
  severity: error
- name: source_payload_sha256_not_null
  type: expect_column_values_to_not_be_null
  column: source_payload_sha256
  severity: error
- name: source_observed_at_not_null
  type: expect_column_values_to_not_be_null
  column: source_observed_at
  severity: error
- name: silver_transformed_at_not_null
  type: expect_column_values_to_not_be_null
  column: silver_transformed_at
  severity: error
- name: silver_run_id_not_null
  type: expect_column_values_to_not_be_null
  column: silver_run_id
  severity: error
sql_templates:
- sql/silver/create/create_silver_pokemon_move.sql
- sql/silver/stage/stage_silver_pokemon_move.sql
- sql/silver/merge/merge_silver_pokemon_move.sql
- sql/silver/quality/quality_silver_pokemon_move.sql
