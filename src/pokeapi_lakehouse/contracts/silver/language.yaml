version: 1
layer: silver
domain: table
owner: pokeapi_lakehouse
logical_name: language
table: language
description: Idiomas de consumo suportados, normalizados da PokéAPI
grain: uma linha por tabela normalizada Silver em language
primary_key:
- language_id
foreign_keys: []
partition_by: []
columns:
- name: language_id
  type: BIGINT
  nullable: false
  description: Identificador do idioma na PokéAPI
  semantic_role: business_key
- name: language_code
  type: STRING
  nullable: false
  description: 'Código usado pela PokéAPI; contrato atual: en'
  semantic_role: dimension
- name: iso639_code
  type: STRING
  nullable: true
  description: Código ISO 639 informado pela origem
  semantic_role: dimension
- name: iso3166_code
  type: STRING
  nullable: true
  description: Código ISO 3166 informado pela origem
  semantic_role: dimension
- name: is_official
  type: BOOLEAN
  nullable: false
  description: Indica idioma oficial nos jogos
  semantic_role: quality
- name: source_url
  type: STRING
  nullable: false
  description: URL do recurso Bronze
  semantic_role: lineage
- name: source_payload_sha256
  type: STRING
  nullable: false
  description: Hash da versão Bronze
  semantic_role: lineage
- name: source_observed_at
  type: TIMESTAMP
  nullable: false
  description: Momento de observação na origem
  semantic_role: lineage
- name: silver_transformed_at
  type: TIMESTAMP
  nullable: false
  description: Momento horário de Brasília (UTC-3) da transformação
  semantic_role: audit
- name: silver_run_id
  type: STRING
  nullable: false
  description: Execução Silver responsável
  semantic_role: audit
quality_expectations:
- name: schema_columns_match_ddl
  type: expect_table_columns_to_match_ordered_list
  columns:
  - language_id
  - language_code
  - iso639_code
  - iso3166_code
  - is_official
  - source_url
  - source_payload_sha256
  - source_observed_at
  - silver_transformed_at
  - silver_run_id
  severity: error
- name: primary_key_not_null
  type: expect_column_values_to_not_be_null
  columns:
  - language_id
  severity: error
- name: primary_key_unique
  type: expect_compound_columns_to_be_unique
  columns:
  - language_id
  severity: error
- name: language_code_not_null
  type: expect_column_values_to_not_be_null
  column: language_code
  severity: error
- name: is_official_not_null
  type: expect_column_values_to_not_be_null
  column: is_official
  severity: error
- name: source_url_not_null
  type: expect_column_values_to_not_be_null
  column: source_url
  severity: error
- name: source_payload_sha256_not_null
  type: expect_column_values_to_not_be_null
  column: source_payload_sha256
  severity: error
- name: source_observed_at_not_null
  type: expect_column_values_to_not_be_null
  column: source_observed_at
  severity: error
- name: silver_transformed_at_not_null
  type: expect_column_values_to_not_be_null
  column: silver_transformed_at
  severity: error
- name: silver_run_id_not_null
  type: expect_column_values_to_not_be_null
  column: silver_run_id
  severity: error
sql_templates:
- sql/silver/create/create_silver_language.sql
- sql/silver/stage/stage_silver_language.sql
- sql/silver/merge/merge_silver_language.sql
- sql/silver/quality/quality_silver_language.sql
