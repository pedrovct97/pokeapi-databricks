  severity: error
- name: display_name_not_null
  type: expect_column_values_to_not_be_null
  column: display_name
  severity: error
- name: version_group_key_not_null
  type: expect_column_values_to_not_be_null
  column: version_group_key
  severity: error
- name: version_group_id_not_null
  type: expect_column_values_to_not_be_null
  column: version_group_id
  severity: error
- name: version_group_name_not_null
  type: expect_column_values_to_not_be_null
  column: version_group_name
  severity: error
- name: generation_id_not_null
  type: expect_column_values_to_not_be_null
  column: generation_id
  severity: error
- name: generation_name_not_null
  type: expect_column_values_to_not_be_null
  column: generation_name
  severity: error
- name: gold_transformed_at_not_null
  type: expect_column_values_to_not_be_null
  column: gold_transformed_at
  severity: error
- name: gold_run_id_not_null
  type: expect_column_values_to_not_be_null
  column: gold_run_id
  severity: error
sql_templates:
- sql/gold/create/create_gold_game_version.sql
- sql/gold/stage/stage_gold_game_version.sql
- sql/gold/merge/merge_gold_game_version.sql
