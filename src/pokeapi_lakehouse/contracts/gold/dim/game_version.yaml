version: 1
layer: gold
domain: dim
owner: pokeapi_lakehouse
logical_name: game_version
table: dim_game_version
description: Dimensão Gold de jogos e versões para filtros de dashboard e contexto de ruleset
grain: uma linha por entidade conformada em dim_game_version
primary_key:
- version_id
foreign_keys: []
partition_by: []
columns:
- name: game_version_key
  type: STRING
  nullable: false
  description: Chave canônica do jogo/versão no formato game_version|version_id
  semantic_role: business_key
- name: version_id
  type: BIGINT
  nullable: false
  description: Identificador do jogo/versão na PokéAPI
  semantic_role: business_key
- name: version_name
  type: STRING
  nullable: false
  description: Nome técnico do jogo/versão, como emerald, yellow, firered ou diamond
  semantic_role: dimension
- name: display_name
  type: STRING
  nullable: false
  description: Nome amigável do jogo exibido no dashboard
  semantic_role: dimension
- name: version_group_key
  type: STRING
  nullable: false
  description: Chave canônica do grupo de versão associado ao jogo
  semantic_role: business_key
- name: version_group_id
  type: BIGINT
  nullable: false
  description: Identificador do grupo de versão associado ao jogo
  semantic_role: business_key
- name: version_group_name
  type: STRING
  nullable: false
  description: Nome técnico do grupo de versão associado ao jogo
  semantic_role: dimension
- name: generation_id
  type: BIGINT
  nullable: false
  description: Identificador da geração derivada do grupo de versão
  semantic_role: business_key
- name: generation_name
  type: STRING
  nullable: false
  description: Nome técnico da geração derivada do grupo de versão
  semantic_role: dimension
- name: region_name
  type: STRING
  nullable: true
  description: Nome técnico da região principal da geração quando disponível na PokéAPI
  semantic_role: dimension
- name: gold_transformed_at
  type: TIMESTAMP
  nullable: false
  description: Momento horário de Brasília (UTC-3) da publicação Gold
  semantic_role: audit
- name: gold_run_id
  type: STRING
  nullable: false
  description: UUID da execução Gold responsável pela publicação
  semantic_role: audit
quality_expectations:
