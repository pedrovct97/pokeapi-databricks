version: 1
layer: gold
domain: dim
owner: pokeapi_lakehouse
logical_name: type
table: dim_type
description: Dimensão Gold de tipos elementais da PokéAPI
grain: uma linha por entidade conformada em dim_type
primary_key:
- type_id
foreign_keys: []
partition_by: []
columns:
- name: type_key
  type: STRING
  nullable: false
  description: Chave canônica do tipo elemental no formato type|id
  semantic_role: business_key
- name: type_id
  type: BIGINT
  nullable: false
  description: Identificador PokéAPI do tipo elemental
  semantic_role: business_key
- name: type_name
  type: STRING
  nullable: false
  description: Nome em inglês do tipo elemental
  semantic_role: dimension
- name: canonical_name
  type: STRING
  nullable: false
  description: Nome canônico normalizado para consumo analítico
  semantic_role: dimension
- name: generation_id
  type: BIGINT
  nullable: true
  description: Identificador da geração em que o tipo foi introduzido
  semantic_role: business_key
- name: generation_name
  type: STRING
  nullable: true
  description: Nome da geração em que o tipo foi introduzido
  semantic_role: dimension
- name: damage_class_id
  type: BIGINT
  nullable: true
  description: Identificador da classe de dano associada ao tipo, quando aplicável
  semantic_role: business_key
- name: damage_class_name
  type: STRING
  nullable: true
  description: Nome da classe de dano associada ao tipo, quando aplicável
  semantic_role: dimension
- name: gold_transformed_at
  type: TIMESTAMP
  nullable: false
  description: Momento horário de Brasília (UTC-3) da publicação Gold
  semantic_role: audit
- name: gold_run_id
  type: STRING
  nullable: false
  description: UUID da execução Gold responsável pela publicação
  semantic_role: audit
quality_expectations:
- name: schema_columns_match_ddl
  type: expect_table_columns_to_match_ordered_list
  columns:
  - type_key
  - type_id
  - type_name
  - canonical_name
  - generation_id
  - generation_name
  - damage_class_id
  - damage_class_name
  - gold_transformed_at
  - gold_run_id
  severity: error
- name: primary_key_not_null
  type: expect_column_values_to_not_be_null
  columns:
  - type_id
  severity: error
- name: primary_key_unique
  type: expect_compound_columns_to_be_unique
  columns:
  - type_id
  severity: error
- name: type_key_not_null
  type: expect_column_values_to_not_be_null
  column: type_key
  severity: error
- name: type_name_not_null
  type: expect_column_values_to_not_be_null
  column: type_name
  severity: error
- name: canonical_name_not_null
  type: expect_column_values_to_not_be_null
  column: canonical_name
  severity: error
- name: gold_transformed_at_not_null
  type: expect_column_values_to_not_be_null
  column: gold_transformed_at
  severity: error
- name: gold_run_id_not_null
  type: expect_column_values_to_not_be_null
  column: gold_run_id
  severity: error
sql_templates:
- sql/gold/create/create_gold_type.sql
- sql/gold/stage/stage_gold_type.sql
- sql/gold/merge/merge_gold_type.sql
- sql/gold/quality/quality_gold_type.sql
