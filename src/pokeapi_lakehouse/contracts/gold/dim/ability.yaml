version: 1
layer: gold
domain: dim
owner: pokeapi_lakehouse
logical_name: ability
table: dim_ability
description: Dimensão Gold de habilidades Pokémon
grain: uma linha por entidade conformada em dim_ability
primary_key:
- ability_id
foreign_keys: []
partition_by: []
columns:
- name: ability_key
  type: STRING
  nullable: false
  description: Chave canônica da habilidade no formato ability|id
  semantic_role: business_key
- name: ability_id
  type: BIGINT
  nullable: false
  description: Identificador PokéAPI da habilidade
  semantic_role: business_key
- name: ability_name
  type: STRING
  nullable: false
  description: Nome em inglês da habilidade
  semantic_role: dimension
- name: canonical_name
  type: STRING
  nullable: false
  description: Nome canônico normalizado para consumo analítico
  semantic_role: dimension
- name: is_main_series
  type: BOOLEAN
  nullable: false
  description: Indica se a habilidade pertence à série principal
  semantic_role: quality
- name: generation_id
  type: BIGINT
  nullable: true
  description: Identificador da geração em que a habilidade foi introduzida
  semantic_role: business_key
- name: generation_name
  type: STRING
  nullable: true
  description: Nome da geração em que a habilidade foi introduzida
  semantic_role: dimension
- name: description
  type: STRING
  nullable: true
  description: Descrição localizada em inglês usada para interpretação da habilidade
  semantic_role: dimension
- name: gold_transformed_at
  type: TIMESTAMP
  nullable: false
  description: Momento horário de Brasília (UTC-3) da publicação Gold
  semantic_role: audit
- name: gold_run_id
  type: STRING
  nullable: false
  description: UUID da execução Gold responsável pela publicação
  semantic_role: audit
quality_expectations:
- name: schema_columns_match_ddl
  type: expect_table_columns_to_match_ordered_list
  columns:
  - ability_key
  - ability_id
  - ability_name
  - canonical_name
  - is_main_series
  - generation_id
  - generation_name
  - description
  - gold_transformed_at
  - gold_run_id
  severity: error
- name: primary_key_not_null
  type: expect_column_values_to_not_be_null
  columns:
  - ability_id
  severity: error
- name: primary_key_unique
  type: expect_compound_columns_to_be_unique
  columns:
  - ability_id
  severity: error
- name: ability_key_not_null
  type: expect_column_values_to_not_be_null
  column: ability_key
  severity: error
- name: ability_name_not_null
  type: expect_column_values_to_not_be_null
  column: ability_name
  severity: error
- name: canonical_name_not_null
  type: expect_column_values_to_not_be_null
  column: canonical_name
  severity: error
- name: is_main_series_not_null
  type: expect_column_values_to_not_be_null
  column: is_main_series
  severity: error
- name: gold_transformed_at_not_null
  type: expect_column_values_to_not_be_null
  column: gold_transformed_at
  severity: error
- name: gold_run_id_not_null
  type: expect_column_values_to_not_be_null
  column: gold_run_id
  severity: error
sql_templates:
- sql/gold/create/create_gold_ability.sql
- sql/gold/stage/stage_gold_ability.sql
- sql/gold/merge/merge_gold_ability.sql
- sql/gold/quality/quality_gold_ability.sql
