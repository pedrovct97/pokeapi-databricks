version: 1
layer: gold
domain: bridge
owner: pokeapi_lakehouse
logical_name: pokemon_move_pool
table: bridge_pokemon_move
description: Ponte Gold de movimentos disponíveis por Pokémon no ruleset Scarlet/Violet
grain: uma linha por movimento disponível para um Pokémon dentro de um ruleset
primary_key:
- pokemon_move_key
foreign_keys: []
partition_by: []
columns:
- name: pokemon_move_key
  type: STRING
  nullable: false
  description: Chave da relação Pokémon-movimento-método-nível no ruleset
  semantic_role: business_key
- name: pokemon_key
  type: STRING
  nullable: false
  description: Chave canônica do Pokémon que pode aprender o movimento
  semantic_role: business_key
- name: pokemon_id
  type: BIGINT
  nullable: false
  description: Identificador PokéAPI do Pokémon que pode aprender o movimento
  semantic_role: business_key
- name: move_key
  type: STRING
  nullable: false
  description: Chave canônica do movimento disponível
  semantic_role: business_key
- name: move_id
  type: BIGINT
  nullable: false
  description: Identificador PokéAPI do movimento disponível
  semantic_role: business_key
- name: move_name
  type: STRING
  nullable: false
  description: Nome em inglês do movimento disponível
  semantic_role: dimension
- name: damage_class_name
  type: STRING
  nullable: true
  description: 'Classe de dano do movimento: physical, special ou status'
  semantic_role: dimension
- name: type_id
  type: BIGINT
  nullable: true
  description: Identificador PokéAPI do tipo elemental do movimento
  semantic_role: business_key
- name: type_name
  type: STRING
  nullable: true
  description: Nome em inglês do tipo elemental do movimento
  semantic_role: dimension
- name: power
  type: INT
  nullable: true
  description: Poder base do movimento informado pela PokéAPI
  semantic_role: metric
- name: accuracy_pct
  type: INT
  nullable: true
  description: Precisão percentual do movimento; nulo quando nunca erra ou não se aplica
  semantic_role: metric
- name: expected_power
  type: DECIMAL(10,2)
  nullable: true
  description: Poder esperado simples herdado da dimensão de movimentos
  semantic_role: metric
- name: priority
  type: INT
  nullable: false
  description: Prioridade de execução do movimento no turno
  semantic_role: metric
- name: learn_method_id
  type: BIGINT
  nullable: false
  description: Identificador PokéAPI do método de aprendizado
  semantic_role: business_key
- name: learn_method_name
  type: STRING
  nullable: false
  description: Nome em inglês do método de aprendizado
  semantic_role: dimension
- name: level_learned_at
  type: INT
  nullable: false
  description: Nível de aprendizado do movimento; zero quando não se aplica
  semantic_role: audit
- name: ruleset_key
  type: STRING
  nullable: false
  description: Chave canônica do ruleset que filtra a disponibilidade do movimento
  semantic_role: business_key
- name: ruleset_id
  type: STRING
  nullable: false
  description: Identificador do ruleset que filtra a disponibilidade do movimento
  semantic_role: business_key
- name: battle_level
  type: INT
  nullable: false
  description: Nível de batalha do ruleset usado para cálculos derivados
  semantic_role: metric
- name: gold_transformed_at
  type: TIMESTAMP
  nullable: false
  description: Momento horário de Brasília (UTC-3) da publicação Gold
  semantic_role: audit
- name: gold_run_id
  type: STRING
  nullable: false
  description: UUID da execução Gold responsável pela publicação
  semantic_role: audit
quality_expectations:
- name: schema_columns_match_ddl
