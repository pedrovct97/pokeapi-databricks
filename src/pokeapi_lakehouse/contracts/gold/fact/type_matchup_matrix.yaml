  severity: error
- name: battle_level_not_null
  type: expect_column_values_to_not_be_null
  column: battle_level
  severity: error
- name: attacking_type_key_not_null
  type: expect_column_values_to_not_be_null
  column: attacking_type_key
  severity: error
- name: attacking_type_name_not_null
  type: expect_column_values_to_not_be_null
  column: attacking_type_name
  severity: error
- name: defending_type_key_not_null
  type: expect_column_values_to_not_be_null
  column: defending_type_key
  severity: error
- name: defending_type_name_not_null
  type: expect_column_values_to_not_be_null
  column: defending_type_name
  severity: error
- name: damage_multiplier_not_null
  type: expect_column_values_to_not_be_null
  column: damage_multiplier
  severity: error
- name: matchup_class_not_null
  type: expect_column_values_to_not_be_null
  column: matchup_class
  severity: error
- name: gold_transformed_at_not_null
  type: expect_column_values_to_not_be_null
  column: gold_transformed_at
  severity: error
